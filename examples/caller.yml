# Copy to .github/workflows/dast.yml in the app repo and replace the <...> values.
name: dast

# Weekly authenticated DAST scan of staging with HawkScan (scoville/dast-action).
# Scan tuning (excluded assets, seeded routes, auth) lives in stackhawk.yml.
on:
  schedule:
    # 03:00 JST Monday (18:00 UTC Sunday)
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      host:
        description: 'Tenant host to scan (bare hostname, no scheme)'
        default: '<stg.example.jp>'
      waf_bypass:
        description: 'Send the WAF bypass header so payloads reach the app. Off = scan as an outsider sees it.'
        type: boolean
        default: true

permissions:
  contents: read
  # Only needed when the WAF key is read from SSM (waf_key_ssm_parameter).
  id-token: write

concurrency:
  # One scan per app/env at a time; a queued run would clash on the platform.
  group: dast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    uses: scoville/dast-action/.github/workflows/dast.yml@v1
    with:
      app_name: <app>
      host: ${{ inputs.host || '<stg.example.jp>' }}
      waf_bypass: ${{ github.event_name != 'workflow_dispatch' || inputs.waf_bypass }}
      # Read the WAF key from SSM (needs AWS_ROLE_TO_ASSUME below)...
      waf_key_ssm_parameter: /<app>-stg/dast/scan-key
      slack_channel_id: ${{ vars.DAST_SLACK_CHANNEL_ID }}
    # Only these secrets are handed to the shared workflow.
    secrets:
      HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
      DRATA_API_KEY: ${{ secrets.DRATA_CCT_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      STACKHAWK_APP_ID: ${{ secrets.STACKHAWK_APP_ID }}
      SCAN_USERNAME: ${{ secrets.DAST_USERNAME }}
      SCAN_PASSWORD: ${{ secrets.DAST_PASSWORD }}
      CLIENT_SLUG: ${{ secrets.DAST_CLIENT_SLUG }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME_STG }}
      # ...or pass the key directly instead:
      # WAF_SCAN_KEY: ${{ secrets.DAST_SCAN_KEY }}
